name: Build Android APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Make / GCC
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Compile C++ Core
        run: |
          g++ main.cpp -o elbek_ai
          ./elbek_ai <<EOF
          admin
          3
          EOF

      - name: Summary
        run: echo "C++ code compiled successfully!"
