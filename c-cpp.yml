name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Make / GCC
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Compile Elbek AI
        run: g++ main.cpp -o elbek_ai

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: elbek_ai_binary
          path: ./elbek_ai





